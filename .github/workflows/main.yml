name: Run Telegram Bot

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Позволяет запускать бота вручную кнопкой на вкладке Actions в GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install aiogram

    - name: Run Bot
      run: |
        # Запускаем бота в фоне, чтобы GitHub Actions не завершал процесс сразу
        nohup python bot.py > bot.log 2>&1 &
        
        # Даем боту поработать и выводим лог для проверки
        sleep 10
        cat bot.log
